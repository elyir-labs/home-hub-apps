# Each app's own tests, and that each still builds.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: tests, the build, and lint
        working-directory: android
        run: ./gradlew test assembleDebug lint

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: tests
        run: |
          # The runner's simulators change with its image, so take whichever iPhone it has.
          id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k in sorted(d, reverse=True) if "iOS" in k for x in d[k] if x["name"].startswith("iPhone")))')
          xcodebuild test -project ios/Houses.xcodeproj -scheme Houses -destination "id=$id"
